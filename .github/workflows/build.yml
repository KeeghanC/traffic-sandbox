name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile, test and render interface previews
        shell: pwsh
        run: ./test.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: traffic-sandbox
          path: build/traffic-sandbox.jar
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: interface-previews
          path: |
            docs/intersection-lab.png
            build/interface-*.png
